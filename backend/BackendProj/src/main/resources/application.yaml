        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: gamingsiteforever@gmail.com
    password: zqlr jkfz tsqj auix
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Trust Gmail's TLS cert so the STARTTLS handshake can't hang
          ssl:
            trust: smtp.gmail.com
          # Gmail's STARTTLS handshake on 587 can take >5s on some networks;
          # give the connect/read/write enough room so a slow-but-working SMTP
          # conversation isn't aborted mid-dialog ("Read timed out").
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

