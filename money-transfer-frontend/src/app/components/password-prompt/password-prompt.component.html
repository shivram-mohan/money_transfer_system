<!-- src/app/components/password-prompt/password-prompt.component.html -->

<h2 mat-dialog-title>
  <mat-icon class="title-icon">lock</mat-icon>
  Confirm your password
</h2>

<mat-dialog-content>
  <p class="prompt-text">Enter your app password to view your balance.</p>

  <form [formGroup]="form" (ngSubmit)="confirm()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
        autofocus />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="'Toggle password visibility'">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('password')?.hasError('required')">
        Password is required
      </mat-error>
    </mat-form-field>

    <p class="error-text" *ngIf="errorMessage">
      <mat-icon>error_outline</mat-icon>
      {{ errorMessage }}
    </p>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="isVerifying">
    Cancel
  </button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="confirm()"
    [disabled]="isVerifying">
    <mat-spinner *ngIf="isVerifying" diameter="20"></mat-spinner>
    <span *ngIf="!isVerifying">Reveal Balance</span>
  </button>
</mat-dialog-actions>
